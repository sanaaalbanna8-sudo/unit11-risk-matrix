    const MATRIX = {

      possible: { minor: "low",    moderate: "medium",   major: "high" },
      unlikely: { minor: "low",    moderate: "low",      major: "medium" }

    const LEVELS = [
      {

        likelihood: "very",

        note: ""
      },
      {

        text: "يعتمد موظفو الشركة كلمات مرور بسيطة مثل «123456» أو اسم العائلة، ولا يغيّرونها بانتظام، فيسهل تخمينها أو تجربتها للدخول إلى الحسابات.",

      {

      },
      {

        impact: "moderate",
        admin: "المنفذ المفتوح غير المستخدم مدخل محتمل للمتسلل. يُغلق فوراً عبر جدار الحماية Firewall، وتُراجع المنافذ المسموحة دورياً.",

      },
      {
        tier: "متقدم",
        topic: "الهندسة الاجتماعية والبرمجيات الخبيثة",

      },
      {

        asset: "تطبيق التداول وقاعدة البيانات",
        text: "تطلق شركة Index Financial Solutions تطبيقاً استثمارياً فورياً. حقول الإدخال تمرر النص إلى استعلام قاعدة البيانات مباشرة، فيمكن إدخال أوامر SQL خبيثة وقراءة أوامر التداول أو تعديلها.",
        likelihood: "very",
        impact: "major",
        admin: "حقن SQL يهدد سرية الأوامر وسلامتها وأموال العملاء. المعالجة قبل الإطلاق: استعلامات معلّمة، والتحقق من المدخلات، وصلاحية دنيا لحساب قاعدة البيانات، وجدار حماية تطبيقات WAF، ومراجعة الكود.",
        note: "أعلى عمود تأثير في جدول 11.6 هو «كبيرة». مع «محتمل جداً» تضيء الخلية الحمراء «شديد»، وهي ما يقابله الوصف الإداري «شديدة جداً»."
      },
      {
        tier: "عميق",
        topic: "استمرار الأعمال والخطر البيئي",
        title: "غرفة خوادم في الطابق السفلي وفيضان نادر",
        asset: "مركز البيانات ونظام الرواتب",
        text: "تقع غرفة الخوادم في الطابق السفلي وتخدم نظام الرواتب. سجلات المدينة لثلاثين سنة لم تُظهر فيضاناً بلغ هذا المبنى. لو وقع فيضان استثنائي لتوقف النظام وتضررت الأجهزة. يطالب التشغيل بنقل الغرفة فوراً لأن الخطر «حرج». قيّم هذا السيناريو بالمصفوفة.",
        likelihood: "unlikely",
        impact: "major",
        admin: "الأثر كبير لو حدث الفيضان، لكن السجل التاريخي يجعل الاحتمال غير مرجح. الخلية صفراء: متوسط. تُوضع خطة استمرارية ومضخات أو نقل مدروس، من دون معاملة الخطر كأنه شديد.",
        note: "درس الجدول: التأثير الكبير وحده لا يجعل الخطر أحمر. «غير محتمل × كبيرة» = متوسط."
      },
      {
        tier: "عميق",
        topic: "فخ المبالغة في التقدير",
        title: "ملاحظات لاصقة لا تحمل أسراراً",
        asset: "انضباط المكتب",
        text: "يكتب بعض الموظفين ملاحظات لاصقة على حافة الشاشة عدة مرات كل أسبوع: مواعيد اجتماعات وأرقام غرف. ليست كلمات مرور ولا بيانات عملاء. يرى مشرف الأمن أن أي ملاحظة لاصقة «ثغرة عالية» ويجب أن تُصنَّف شديدة. قيّم هذه الملاحظات فقط.",
        likelihood: "very",
        impact: "minor",
        admin: "التكرار مرتفع، لكن المحتوى لا يفتح نظاماً ولا يكشف بيانات. الخلية صفراء: متوسط. تُطبَّق سياسة مكتب نظيف حتى لا تتحول العادة لاحقاً إلى كتابة أسرار، والشدة تبقى وفق المحتوى الفعلي.",
        note: "«محتمل جداً × طفيفة» = متوسط. الاسم السيئ للممارسة لا يرفع الخلية إلى الأحمر."
      },
      {
        tier: "عميق",
        topic: "السحابة وتصنيف الأصول",
        title: "حاوية سحابية للشعارات المنشورة أصلاً",
        asset: "مواد تسويقية عامة",
        text: "يحتفظ مزود سحابي بنسخ الشعارات والنشرات الصحفية المنشورة على الموقع العام. التخزين مشفر، والدخول بحساب مؤسسي موحد، وآخر تدقيق بلا ملاحظات عالية. لا أسرار تجارية ولا بيانات شخصية. يصر المدير على أن أي تخزين سحابي خطره شديد. قيّم هذه الحاوية وحدها.",
        likelihood: "unlikely",
        impact: "minor",
        admin: "الأصل عام أصلاً، والضوابط قائمة، فلا مسار واقعي لانكشاف سر. الخلية خضراء: منخفض. يُبقى التشفير والتدقيق، ويُرفض رفع التقييم لأن الوسيط «سحابة».",
        note: "«غير محتمل × طفيفة» = منخفض. تقييم الخطر يبدأ من الأصل لا من اسم التقنية."
      },
      {
        tier: "عميق",

        title: "تأخر اكتشاف اختراق بعد إغلاق ثغرة SQL",
        asset: "كشف الاختراق وأوامر التداول",
        text: "أُغلقت ثغرة حقن SQL في تطبيق Index Financial Solutions باستعلامات معلّمة. ما زالت السجلات تُراجع يدوياً مرة كل أسبوع، وخطة الاستجابة للحوادث غير مختبرة. قد يمر اختراق جديد أياماً قبل رصده، وخلالها يمكن العبث بأوامر التداول. يعتبر التطوير أن إغلاق الثغرة أنهى الخطر. قيّم خطر تأخر الاكتشاف المتبقي فقط.",
        likelihood: "possible",
        impact: "major",
        admin: "إغلاق الثغرة السابقة لا يلغي خطر بطء الكشف. الاحتمال واقعي والأثر على أوامر التداول كبير، فالخلية برتقالية: مرتفع. المعالجة: مراقبة آلية SIEM، وتنبيه فوري، وتجربة خطة الاستجابة.",
        note: "الخطر المتبقي يُقيَّم وحده. «محتمل × كبيرة» = مرتفع، وهو أقل من الخلية الحمراء لحالة الحقن قبل الإصلاح، وأعلى من اعتبار الخطر منتهياً."
      }
    ];

    LEVELS.forEach((level, index) => {
      const tone = MATRIX[level.likelihood] && MATRIX[level.likelihood][level.impact];
      if (!tone) throw new Error("مستوى غير مكتمل: " + (index + 1));
      level.severity = tone;
      level.n = index + 1;
    });

    const STORE = "btec-u11-risk-matrix-v1";
    const emptyPicks = () => ({ likelihood: null, impact: null, severity: null });

    const state = {
      screen: "intro",
      level: 0,
      score: 0,
      picks: emptyPicks(),
      locked: false,
      history: [],
      confirmReset: false
    };

    function load() {
      try {
        const raw = localStorage.getItem(STORE);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !Array.isArray(saved.history)) return;
        state.screen = saved.screen || "intro";
        state.level = Number(saved.level) || 0;
        state.score = Number(saved.score) || 0;
        state.picks = Object.assign(emptyPicks(), saved.picks || {});
        state.locked = Boolean(saved.locked);
        state.history = saved.history;
        if (state.level > LEVELS.length - 1 && state.screen === "play") state.screen = "result";
      } catch (err) {
        /* تبدأ جلسة جديدة إذا تلفت البيانات المحفوظة */
      }
    }

    function save() {
      localStorage.setItem(STORE, JSON.stringify({
        screen: state.screen,
        level: state.level,
        score: state.score,
        picks: state.picks,
        locked: state.locked,
        history: state.history
      }));
    }

    function resetAll() {
      state.screen = "intro";
      state.level = 0;
      state.score = 0;
      state.picks = emptyPicks();
      state.locked = false;
      state.history = [];
      state.confirmReset = false;
      localStorage.removeItem(STORE);
      render();
    }

    function label(group, id) {
      const list = group === "likelihood" ? LIKELIHOODS : group === "impact" ? IMPACTS : SEVERITIES;
      const found = list.find((item) => item.id === id);
      return found ? found.ar : "—";
    }

    function grade(score) {
      const ratio = score / (LEVELS.length * 30);
      if (ratio >= 0.9) return { name: "متميز", line: "قراءة ثابتة للحالة وللجدول 11.6." };
      if (ratio >= 0.7) return { name: "جيد جداً", line: "التقييم قريب من المصفوفة، وتبقى حالات تستحق المراجعة." };
      if (ratio >= 0.5) return { name: "جيد", line: "الأساس موجود. أعد الحالات التي انحرف فيها التقاطع." };
      return { name: "يحتاج إعادة التدريب", line: "راجع كيف يغيّر كل محور لون الخلية قبل الجولة التالية." };
    }

    function matrixMarkup(mode) {
      const pickL = state.picks.likelihood;
      const pickI = state.picks.impact;
      const level = LEVELS[state.level];
      const showAnswer = mode === "play" && state.locked && level;
      const rows = LIKELIHOODS.map((row) => {
        const heads = `<div class="cell flex items-center justify-center bg-slate-900/80 px-1 text-center text-[11px] font-bold leading-tight text-cyan-100 border-cyan-400/20 sm:text-xs ${pickL === row.id ? "axis-hot" : ""}">${row.ar}</div>`;
        const cells = IMPACTS.map((col) => {
          const sev = MATRIX[row.id][col.id];
          const isPick = pickL === row.id && pickI === col.id;
          const isAnswer = showAnswer && level.likelihood === row.id && level.impact === col.id;
          const on = mode === "play" && ((isPick && !state.locked) || isAnswer);
          const miss = showAnswer && isPick && !isAnswer;
          const hot = mode === "play" && !on && !miss && (pickL === row.id || pickI === col.id);
          const tag = isAnswer ? "الإجابة" : miss ? "اختيارك" : on ? "تقاطعك" : "";
          return `<div class="cell tone-${sev} ${on ? "is-on" : ""} ${isAnswer ? "is-answer" : ""} ${miss ? "is-miss" : ""} ${hot ? "axis-hot" : ""} relative flex flex-col items-center justify-center px-1 text-center" data-cell="${row.id}-${col.id}" role="img" aria-label="${row.ar} مع ${col.ar}: ${label("severity", sev)}">
            ${tag ? `<span class="mb-0.5 rounded-full bg-black/35 px-1.5 py-0.5 text-[9px] font-bold ${on && sev === "medium" ? "text-slate-900" : "text-white"}">${tag}</span>` : ""}
            <span class="text-xs font-extrabold sm:text-sm">${label("severity", sev)}</span>
          </div>`;
        }).join("");
        return heads + cells;
      }).join("");

      const cols = IMPACTS.map((col) => `<div class="flex items-center justify-center px-1 text-center text-[11px] font-bold text-emerald-100 sm:text-xs ${pickI === col.id ? "text-white" : ""}">${col.ar}</div>`).join("");

      let readout = "اختر الاحتمال والتأثير لتضيء خلية التقاطع.";
      if (mode === "play" && pickL && pickI && !state.locked) {
        const sev = MATRIX[pickL][pickI];
        readout = `${label("likelihood", pickL)} × ${label("impact", pickI)} ← ${label("severity", sev)}`;
      } else if (showAnswer) {
        readout = `${label("likelihood", level.likelihood)} × ${label("impact", level.impact)} ← ${label("severity", level.severity)}`;
      }

      return `
        <section class="rounded-3xl border border-white/10 bg-slate-950/75 p-4 shadow-2xl shadow-black/30 sm:p-5" aria-label="مصفوفة المخاطر">
          <div class="mb-3 flex items-start justify-between gap-3">
            <div>
              <p class="text-[11px] font-bold tracking-wide text-cyan-300">الجدول 11.6</p>
              <h2 class="text-lg font-extrabold text-white">مصفوفة المخاطر</h2>
            </div>
            <p class="num rounded-full border border-white/10 bg-white/5 px-2 py-1 text-[11px] text-slate-300">3 × 3</p>
          </div>
          <p class="mb-2 text-center text-[11px] font-bold text-emerald-200">تأثير التهديد</p>
          <div class="grid grid-cols-4 gap-1.5 sm:gap-2">
            <div class="flex items-end justify-center pb-1 text-center text-[10px] font-bold leading-tight text-cyan-200">احتمالية<br>الحدوث</div>
            ${cols}
            ${rows}
          </div>
          <p id="matrix-readout" class="mt-3 min-h-6 text-center text-sm font-bold text-white" aria-live="polite">${readout}</p>
          <ul class="mt-3 grid grid-cols-4 gap-1.5 text-center">
            ${SEVERITIES.map((item) => `<li class="cell compact tone-${item.tone} rounded-xl px-1 py-1.5"><span class="block text-[11px] font-extrabold leading-4">${item.ar}</span><span class="block text-[10px] leading-4 opacity-75">${item.swatch}</span></li>`).join("")}
          </ul>
        </section>`;
    }

    function choiceButtons(group, items) {
      const picked = state.picks[group];
      const level = LEVELS[state.level];
      return items.map((item) => {
        const selected = picked === item.id;
        const correct = state.locked && level[group] === item.id;
        const wrong = state.locked && selected && !correct;
        const cls = correct
          ? "border-emerald-300/80 bg-emerald-400/15 text-white"
          : wrong
            ? "border-rose-400/70 bg-rose-500/10 text-white"
            : selected
              ? "border-cyan-300/90 bg-cyan-400/15 text-white shadow-[0_0_24px_rgba(34,211,238,.18)]"
              : "border-white/10 bg-white/[0.03] text-slate-100 hover:border-cyan-300/40 hover:bg-white/[0.05]";
        return `<button type="button" data-action="pick" data-group="${group}" data-value="${item.id}" aria-pressed="${selected}" class="rounded-2xl border px-3 py-3 text-right transition ${cls} ${state.locked ? "pointer-events-none" : ""}">
          <span class="block text-sm font-extrabold">${item.ar}</span>
          <span class="num mt-0.5 block text-[11px] font-semibold text-slate-400">${item.en}</span>
        </button>`;
      }).join("");
    }

    function feedbackMarkup() {
      const level = LEVELS[state.level];
      const last = state.history[state.history.length - 1];
      if (!state.locked || !last || last.n !== level.n) return "";
      const row = (name, ok, chosen, right) => `
        <li class="flex items-start justify-between gap-3 rounded-2xl border border-white/10 bg-black/20 px-3 py-2">
          <span>
            <span class="block text-[11px] text-slate-400">${name}</span>
            <span class="font-bold">${chosen}</span>
            ${ok ? "" : `<span class="mt-0.5 block text-[11px] font-bold text-amber-100">خلية الجدول: ${right}</span>`}
          </span>
          <span class="rounded-full px-2 py-1 text-[11px] font-extrabold ${ok ? "bg-emerald-400/15 text-emerald-200" : "bg-amber-400/15 text-amber-100"}">${ok ? "مطابق" : "راجع التقاطع"}</span>
        </li>`;
      return `
        <section id="feedback" class="rise rounded-3xl border border-cyan-300/20 bg-slate-900/80 p-4 sm:p-5">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h3 class="text-base font-extrabold">${last.points === 30 ? "التقاطع مطابق للجدول" : "اقرأ الخلية المضيئة"}</h3>
            <p class="num rounded-full bg-cyan-400/15 px-3 py-1 text-sm font-extrabold text-cyan-100">+${last.points} / 30</p>
          </div>
          <ul class="grid gap-2">
            ${row("احتمالية الحدوث", last.ok.likelihood, label("likelihood", last.picks.likelihood), label("likelihood", level.likelihood))}
            ${row("تأثير التهديد", last.ok.impact, label("impact", last.picks.impact), label("impact", level.impact))}
            ${row("شدة المخاطر", last.ok.severity, label("severity", last.picks.severity), label("severity", level.severity))}
          </ul>
          <div class="mt-4 border-r-4 border-cyan-300 pr-3">
            <p class="text-[11px] font-bold text-cyan-200">التبرير الإداري</p>
            <p class="mt-1 text-sm leading-7 text-slate-100">${level.admin}</p>
          </div>
          ${level.note ? `<p class="mt-3 rounded-2xl border border-amber-300/25 bg-amber-400/10 px-3 py-2 text-sm leading-7 text-amber-50">${level.note}</p>` : ""}
        </section>`;
    }

    function shell(inner) {
      const total = LEVELS.length * 30;
      const segments = LEVELS.map((level, index) => {
        const done = state.history.some((item) => item.n === level.n);
        const current = state.screen === "play" && index === state.level;
        const cls = done
          ? "bg-emerald-400"
          : current
            ? "bg-cyan-300 shadow-[0_0_12px_rgba(103,232,249,.8)]"
            : "bg-white/10";
        return `<span class="h-2 flex-1 rounded-full ${cls}" title="المستوى ${level.n}"></span>`;
      }).join("");
      return `
        <header class="sticky top-0 z-20 -mx-4 mb-6 border-b border-white/10 bg-[#070b12]/85 px-4 py-3 backdrop-blur-xl sm:-mx-6 sm:px-6">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="grid h-11 w-11 place-items-center rounded-2xl border border-cyan-300/30 bg-cyan-400/10 text-cyan-200">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 3 5 6v6c0 4.2 2.7 7.4 7 9 4.3-1.6 7-4.8 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.6"/>
                  <path d="M8 12.5 11 15l5-5" stroke="#6ee7b7" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </span>
              <div>
                <p class="text-[11px] font-bold text-cyan-300">BTEC · الوحدة 11</p>
                <p class="text-sm font-extrabold leading-5">تقييم المخاطر ومصفوفة الأمان</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-1.5 text-center">
                <p class="text-[10px] text-slate-400">النقاط</p>
                <p class="num text-base font-black text-emerald-300"><span id="score">${state.score}</span> <span class="text-[11px] text-slate-400">/ ${total}</span></p>
              </div>
              <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-1.5 text-center">
                <p class="text-[10px] text-slate-400">المستوى</p>
                <p class="num text-base font-black text-white">${state.screen === "result" ? LEVELS.length : state.screen === "play" ? state.level + 1 : 0} <span class="text-[11px] text-slate-400">/ ${LEVELS.length}</span></p>
              </div>
              <button type="button" data-action="ask-reset" class="rounded-2xl border border-white/10 px-3 py-2 text-xs font-bold text-slate-300 hover:border-white/30 hover:text-white">إعادة</button>
            </div>
          </div>
          <div class="flex gap-1.5" role="progressbar" aria-valuemin="0" aria-valuemax="${LEVELS.length}" aria-valuenow="${state.history.length}" aria-label="التقدم عبر المستويات">${segments}</div>
        </header>
        ${inner}
        ${state.confirmReset ? `
          <div class="fixed inset-0 z-40 grid place-items-center bg-black/60 px-4">
            <div class="w-full max-w-sm rounded-3xl border border-white/10 bg-slate-900 p-5 shadow-2xl">
              <h3 class="text-lg font-extrabold">بدء التدريب من جديد؟</h3>
              <p class="mt-2 text-sm leading-7 text-slate-300">تُمسح نقاط هذه الجولة وسجل المستويات على هذا الجهاز.</p>
              <div class="mt-4 flex gap-2">
                <button type="button" data-action="reset" class="flex-1 rounded-2xl bg-rose-500 px-3 py-2.5 text-sm font-extrabold text-white">مسح التقدم</button>
                <button type="button" data-action="cancel-reset" class="flex-1 rounded-2xl border border-white/15 px-3 py-2.5 text-sm font-bold">متابعة</button>
              </div>
            </div>
          </div>` : ""}`;
    }

    function introScreen() {
      return shell(`
        <main class="grid items-start gap-5 lg:grid-cols-[1.15fr_.85fr]">
          <section class="rise rounded-3xl border border-white/10 bg-slate-900/70 p-5 shadow-2xl sm:p-7">
            <p class="mb-2 inline-flex rounded-full border border-emerald-300/30 bg-emerald-400/10 px-3 py-1 text-[11px] font-bold text-emerald-200">طلاب تكنولوجيا المعلومات · الأمن السيبراني</p>
            <h1 class="text-3xl font-black leading-snug text-white sm:text-4xl">مصفوفة المخاطر الأمنية</h1>
            <p class="mt-3 text-base leading-8 text-slate-300">عشر حالات واقعية متدرجة. في كل حالة تقدر احتمالية الحدوث وتأثير التهديد وشدة المخاطر، وترى التقاطع يضيء على شبكة 3×3 بأسلوب الجدول 11.6.</p>
            <ol class="mt-5 grid gap-2 text-sm">
              <li class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2"><span class="font-extrabold text-cyan-200">1.</span> اقرأ الحالة وحدد الأصل المهدَّد.</li>
              <li class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2"><span class="font-extrabold text-cyan-200">2.</span> اختر الاحتمال والتأثير. الخلية المقابلة تضيء: أصفر للمتوسط، برتقالي للمرتفع، أحمر للشديد.</li>
              <li class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2"><span class="font-extrabold text-cyan-200">3.</span> اقرأ الشدة من الخلية، ثم أكد إجابتك لترى التقاطع النموذجي والتبرير الإداري.</li>
            </ol>
            <button type="button" data-action="start" class="mt-6 w-full rounded-2xl bg-gradient-to-l from-cyan-400 to-emerald-400 px-4 py-3 text-base font-black text-slate-950 shadow-[0_10px_40px_rgba(34,211,238,.25)] sm:w-auto">ابدأ المستوى الأول</button>
          </section>
          ${matrixMarkup("intro")}
        </main>`);
    }

    function playScreen() {
      const level = LEVELS[state.level];
      const ready = state.picks.likelihood && state.picks.impact && state.picks.severity;
      return shell(`
        <main class="grid items-start gap-5 lg:grid-cols-[minmax(0,1.15fr)_minmax(0,0.9fr)]">
            <article class="order-1 rise rounded-3xl border border-white/10 bg-slate-900/70 p-5 shadow-2xl sm:p-6 lg:col-start-1 lg:row-start-1">
              <div class="mb-3 flex flex-wrap items-center gap-2 text-[11px] font-bold">
                <span class="rounded-full bg-cyan-400/15 px-2.5 py-1 text-cyan-100">المستوى <span class="num">${level.n}</span></span>
                <span class="rounded-full bg-white/5 px-2.5 py-1 text-slate-300">${level.tier}</span>
                <span class="rounded-full bg-emerald-400/10 px-2.5 py-1 text-emerald-200">${level.topic}</span>
              </div>
              <h1 class="text-2xl font-black leading-snug text-white">${level.title}</h1>
              <p class="mt-2 text-xs font-bold text-slate-400">الأصل: ${level.asset}</p>
              <p class="mt-3 text-[15px] leading-8 text-slate-200">${level.text}</p>
            </article>
            <div class="order-2 lg:col-start-2 lg:row-start-1 lg:row-span-3 lg:sticky lg:top-28">${matrixMarkup("play")}</div>
            <section class="order-3 rounded-3xl border border-white/10 bg-slate-900/55 p-4 sm:p-5 lg:col-start-1 lg:row-start-2">
              <fieldset>
                <legend class="mb-2 text-sm font-extrabold text-cyan-100">احتمالية الحدوث</legend>
                <div class="grid gap-2 sm:grid-cols-3">${choiceButtons("likelihood", LIKELIHOODS)}</div>
              </fieldset>
              <fieldset class="mt-4">
                <legend class="mb-2 text-sm font-extrabold text-emerald-100">تأثير التهديد</legend>
                <div class="grid gap-2 sm:grid-cols-3">${choiceButtons("impact", IMPACTS)}</div>
              </fieldset>
              <fieldset class="mt-4">
                <legend class="mb-2 text-sm font-extrabold text-amber-100">شدة المخاطر التي تحددها الخلية</legend>
                <div class="grid gap-2 sm:grid-cols-4">${choiceButtons("severity", SEVERITIES)}</div>
              </fieldset>
              <div class="mt-4 flex flex-wrap gap-2">
                ${state.locked
                  ? `<button type="button" data-action="next" class="rounded-2xl bg-gradient-to-l from-cyan-400 to-emerald-400 px-5 py-3 text-sm font-black text-slate-950">${state.level === LEVELS.length - 1 ? "عرض النتيجة" : "المستوى التالي"}</button>`
                  : `<button type="button" data-action="submit" ${ready ? "" : "disabled"} class="rounded-2xl bg-white px-5 py-3 text-sm font-black text-slate-950 disabled:cursor-not-allowed disabled:bg-white/20 disabled:text-white/50">تأكيد التقييم وإضاءة الإجابة</button>`}
              </div>
            </section>
            <div class="order-4 lg:col-start-1 lg:row-start-3">${feedbackMarkup()}</div>
        </main>`);
    }

    function resultScreen() {
      const g = grade(state.score);
      const rows = LEVELS.map((level) => {
        const item = state.history.find((entry) => entry.n === level.n);
        const points = item ? item.points : 0;
        return `<li class="rounded-2xl border border-white/10 bg-black/20 p-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="text-[11px] text-slate-400">المستوى <span class="num">${level.n}</span> · ${level.tier}</p>
              <p class="font-extrabold">${level.title}</p>
              <p class="mt-1 text-xs leading-6 text-slate-300">${label("likelihood", level.likelihood)} × ${label("impact", level.impact)} ← ${label("severity", level.severity)}</p>
            </div>
            <div class="text-left">
              <span class="cell compact tone-${level.severity} mb-1 inline-flex rounded-xl px-2 py-1 text-[11px] font-extrabold">${label("severity", level.severity)}</span>
              <p class="num text-sm font-black">${points}<span class="text-[11px] text-slate-400">/30</span></p>
            </div>
          </div>
        </li>`;
      }).join("");
      return shell(`
        <main class="mx-auto grid max-w-3xl gap-4">
          <section class="rise rounded-3xl border border-white/10 bg-slate-900/75 p-6 text-center shadow-2xl">
            <p class="text-xs font-bold text-cyan-300">نهاية الجولات العشر</p>
            <h1 class="mt-2 text-3xl font-black">${g.name}</h1>
            <p class="num mt-3 text-5xl font-black text-emerald-300">${state.score}<span class="text-lg text-slate-400"> / ${LEVELS.length * 30}</span></p>
            <p class="mt-3 text-sm leading-7 text-slate-300">${g.line}</p>
            <button type="button" data-action="reset" class="mt-5 rounded-2xl bg-gradient-to-l from-cyan-400 to-emerald-400 px-5 py-3 text-sm font-black text-slate-950">جولة جديدة</button>
          </section>
          <ol class="grid gap-2">${rows}</ol>
        </main>`);
    }

    function render() {
      const app = document.getElementById("app");
      const html = state.screen === "play" ? playScreen() : state.screen === "result" ? resultScreen() : introScreen();
      app.innerHTML = html;
      if (state.locked && state.screen === "play") {
        const box = document.getElementById("feedback");
        if (box) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function submit() {
      const level = LEVELS[state.level];
      if (state.locked || !state.picks.likelihood || !state.picks.impact || !state.picks.severity) return;
      const ok = {
        likelihood: state.picks.likelihood === level.likelihood,
        impact: state.picks.impact === level.impact,
        severity: state.picks.severity === level.severity
      };
      const points = (ok.likelihood ? 10 : 0) + (ok.impact ? 10 : 0) + (ok.severity ? 10 : 0);
      state.score += points;
      state.locked = true;
      state.history.push({
        n: level.n,
        picks: { ...state.picks },
        ok,
        points
      });
      save();
      render();
    }

    document.getElementById("app").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "start") {
        state.screen = "play";
        state.level = 0;
        state.score = 0;
        state.history = [];
        state.picks = emptyPicks();
        state.locked = false;
        save();
        render();
      } else if (action === "pick" && !state.locked) {
        const group = button.dataset.group;
        const value = button.dataset.value;
        state.picks[group] = value;
        save();
        render();
        const again = document.querySelector(`[data-group="${group}"][data-value="${value}"]`);
        if (again) again.focus();
      } else if (action === "submit") {
        submit();
      } else if (action === "next") {
        if (state.level >= LEVELS.length - 1) {
          state.screen = "result";
        } else {
          state.level += 1;
          state.picks = emptyPicks();
          state.locked = false;
        }
        save();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (action === "ask-reset") {
        state.confirmReset = true;
        render();
      } else if (action === "cancel-reset") {
        state.confirmReset = false;
        render();
      } else if (action === "reset") {
        resetAll();
      }
    });

    load();
    render();
  </script>
</body>
</html>
